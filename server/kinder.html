<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Kinder | Carolina Castellanos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .soon-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }
      .soon-card {
        width: min(100%, 560px);
        text-align: center;
      }
      .soon-card h1 {
        font-size: clamp(2.4rem, 8vw, 4rem);
        margin-bottom: 14px;
      }
      .soon-card p {
        max-width: 380px;
        margin: 0 auto 26px;
        color: rgba(255, 255, 255, 0.84);
      }
      .soon-card .pill {
        margin: 0 auto 18px;
      }
    </style>
  </head>
  <body>
    <main class="soon-shell">
      <section class="card green-card soon-card">
        <p class="pill"><span class="live-dot" aria-hidden="true"></span>Kinder</p>
        <h1>Estamos construyendo este apartado</h1>
        <p>Estará disponible muy pronto.</p>
        <a class="button button-outline" href="/">Volver al inicio <svg class="icon button-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6" /></svg></a>
      </section>
    </main>
  </body>
</html>
