<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{subtitle}}" />
    <title>Clase gratis: {{title}} | CreZen por Carolina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/formulario/styles.css?v=1" />
  </head>
  <body>
    <svg width="0" height="0" class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-lotus" viewBox="0 0 48 28"><path d="M24 26C19 21 18 12 24 3c6 9 5 18 0 23Z" /><path d="M24 26c-6-2-12-8-12-17 6 1 11 6 12 17Z" /><path d="M24 26c6-2 12-8 12-17-6 1-11 6-12 17Z" /><path d="M24 26c-7 0-15-3-19-10 6-1 13 2 19 10Z" /><path d="M24 26c7 0 15-3 19-10-6-1-13 2-19 10Z" /></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2" /><path d="m16 10 5-3v10l-5-3" /></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2" /><path d="M4 10h16M8 3v4m8-4v4m-8 7h.01M12 14h.01M16 14h.01m-8 3h.01M12 17h.01M16 17h.01" /></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" /><path d="M12 7v5l3.5 2" /></symbol>
      <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5" /><path d="M5.5 20v-1a6.5 6.5 0 0 1 13 0v1" /></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m4 7 8 6 8-6" /></symbol>
      <symbol id="i-whatsapp" viewBox="0 0 24 24"><path d="M20.5 11.5a8.5 8.5 0 0 1-12.6 7.5L3.5 20l1.3-4.1A8.5 8.5 0 1 1 20.5 11.5Z" /><path d="M8.5 8.1c.2-.5.5-.5.8-.5h.5c.3 0 .4.2.5.4l.8 1.8c.1.2.1.4 0 .6l-.5.7c-.1.2-.1.3 0 .5.5.9 1.2 1.7 2.2 2.2.2.1.4.1.5 0l.7-.5c.2-.1.4-.1.6 0l1.8.8c.3.1.4.3.4.5v.5c0 .3 0 .6-.5.8-.4.2-1 .3-1.6.2-1-.1-2.5-.8-4-2.2-1.3-1.2-2.1-2.6-2.3-3.6-.1-.6 0-1.2.2-1.6Z" /></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 3 10.5l7 2.5 2.5 7L21 3Z" /><path d="m10 13 4-4" /></symbol>
    </svg>

    <main class="page">
      <header class="brand">
        <svg class="brand-lotus" aria-hidden="true"><use href="#i-lotus" /></svg>
        <p class="brand-name">CreZen</p>
        <p class="brand-sub">Por Carolina</p>
      </header>

      <p class="pill"><svg class="icon" aria-hidden="true"><use href="#i-video" /></svg><span>Clase gratis en Zoom</span></p>

      <section class="intro" aria-labelledby="class-title">
        <h1 id="class-title">{{title}}</h1>
        <p>{{subtitle}}</p>
        <span class="divider" aria-hidden="true"></span>
      </section>

      <section class="schedule" aria-label="Fecha y hora de la clase">
        <div class="schedule-item">
          <svg class="icon" aria-hidden="true"><use href="#i-calendar" /></svg>
          <p><span>Fecha:</span><strong>{{date_label}}</strong></p>
        </div>
        <div class="schedule-item">
          <svg class="icon" aria-hidden="true"><use href="#i-clock" /></svg>
          <p><span>Hora:</span><strong>{{hour_label}}</strong><small>(Hora Colombia)</small></p>
        </div>
      </section>

      <section class="speaker" aria-label="Expositora">
        <img src="{{speaker_photo}}" alt="{{speaker_name}}" width="160" height="160" />
        <div>
          <p class="speaker-kicker">Clase impartida por</p>
          <p class="speaker-name">{{speaker_name}}</p>
          <p class="speaker-role">{{speaker_role}}</p>
        </div>
      </section>

      <section class="signup" aria-labelledby="signup-title">
        <h2 id="signup-title">Reserva tu cupo gratuito</h2>
        <p class="form-errors" role="alert">{{errors}}</p>
        <form method="post" action="/formulario" novalidate>
          <label class="field">
            <svg class="icon" aria-hidden="true"><use href="#i-person" /></svg>
            <span class="sr-only">Nombre completo</span>
            <input name="full_name" value="{{full_name}}" placeholder="Nombre completo" autocomplete="name" maxlength="120" required />
          </label>
          <label class="field">
            <svg class="icon" aria-hidden="true"><use href="#i-mail" /></svg>
            <span class="sr-only">Correo electrónico</span>
            <input type="email" name="email" value="{{email}}" placeholder="Correo electrónico" autocomplete="email" maxlength="160" required />
          </label>
          <label class="field">
            <svg class="icon" aria-hidden="true"><use href="#i-whatsapp" /></svg>
            <span class="sr-only">WhatsApp</span>
            <input type="tel" name="whatsapp" value="{{whatsapp}}" placeholder="WhatsApp" autocomplete="tel" inputmode="tel" maxlength="30" required />
          </label>
          <label class="hp" aria-hidden="true">Sitio web <input name="website" tabindex="-1" autocomplete="off" /></label>
          <label class="consent">
            <input type="checkbox" name="consent" value="yes" required />
            <span>Acepto recibir la información de la clase y comunicaciones relacionadas.</span>
          </label>
          <button class="button" type="submit">Inscribirme gratis</button>
        </form>
        <p class="note"><svg class="icon" aria-hidden="true"><use href="#i-send" /></svg><span>Te enviaremos por correo y WhatsApp los datos de acceso al Zoom.</span></p>
      </section>
    </main>
  </body>
</html>
